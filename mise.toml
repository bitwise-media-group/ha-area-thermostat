#
# area-thermostat consumes the shared toolchain (bitwise-media-group/toolchain)
# as the .mise/ submodule: pinned tools come from its config.toml (loaded
# natively as .mise/config.toml), the shared tasks from common/ and the python
# archetype (ruff + pytest through uv, plus the prose, license, shell,
# container and workflow passes), and the Makefile is a thin forwarder
# (.mise/archetypes/python/include.mk). There is nothing to pin here: the
# toolchain's uv provisions Python from requires-python in pyproject.toml, and
# ruff and pytest are dev dependencies locked in uv.lock. The archetype's tasks
# cover everything this repo needs, so there are no repo-local tasks.

[task_config]
includes = [".mise/common/tasks.toml", ".mise/archetypes/python/tasks.toml"]
