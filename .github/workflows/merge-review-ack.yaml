# Merge review ack — thin caller closing the fork-PR auto-merge gap: an
# approval on a fork PR carries no secrets, so the review path in merge.yaml
# can't merge it directly, and if CI was already green the approval is the last
# event. This workflow completes on an approving review purely so its
# workflow_run(completed) fires in the base-repo context, where the merge
# callers retry the merge. Harmless for same-repo PRs. Its name is listed in
# the `workflow_run.workflows` of merge.yaml and dependabot-merge.yaml.
#
# Pinned to a full commit SHA (tag in the comment); Dependabot keeps it fresh.

name: Merge Review Ack

on:
  pull_request_review:
    types: [submitted]

# does no privileged work; grants nothing
permissions: {}

jobs:
  ack:
    uses: bitwise-media-group/github-workflows/.github/workflows/merge-review-ack.yaml@677e862cc088fe8f7b8948189467fe77e60e93a9 # v6.0.2
