# Security analysis — thin caller for the org's reusable CodeQL workflow. Root
# detection only covers actions/go/javascript, so the `languages` input names
# the matrix explicitly: `actions` for the workflow callers and `python` for
# the integration source, both analysed build-free.
#
# Pinned to a full commit SHA (tag in the comment); Renovate keeps it fresh.

name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]
  schedule:
    - cron: "28 20 * * 4"

# ceiling for the reusable workflow's analyze job
permissions:
  # upload analysis results to code scanning
  security-events: write
  # fetch internal or private CodeQL packs
  packages: read
  # only required for workflows in private repositories
  actions: read
  # check out the repository
  contents: read

jobs:
  analyze:
    uses: bitwise-media-group/github-workflows/.github/workflows/security.yaml@b3d4519a6d79376364184f0ca298685dcfa287f2 # v6.1.1
    with:
      languages: "actions,python"
