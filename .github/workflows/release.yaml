# Caller for the org's reusable release workflow. This repo has no
# .goreleaser.yaml and no zensical.toml, so the reusable side is just the
# release-please cut (goreleaser/publish, docs, and vanity-tags jobs skip):
# a versioned tag + CHANGELOG over the Conventional-Commit history. The
# release commit bumps version.txt, the manifest.json "version" (HACS shows
# it in the UI), and the pyproject version via the extra-files updaters in
# release-please-config.json. HACS installs straight from the tagged source,
# so no assets need building or uploading.
#
# Manifest mode: configuration lives in release-please-config.json and the
# current version in .release-please-manifest.json at the repo root.
#
# Pinned to a full commit SHA (tag in the comment); Dependabot keeps it fresh.

name: Release

on:
  push:
    branches: [main]

# Ceiling for the reusable workflow's jobs. GitHub resolves a reusable
# workflow's permissions as the union of every job and ignores `if:`, so the
# caller must grant every scope any job declares — even the goreleaser/publish
# and docs jobs that are skipped here — or the run fails at startup. Each
# reusable job narrows to its own declared scopes; the job that actually runs
# (release-please) uses contents/issues/pull-requests.
permissions:
  # create release commits, tags, and GitHub Releases; upload release assets
  contents: write
  # release-please creates PR labels via the issues API
  issues: write
  # open and update the release PR
  pull-requests: write
  # cosign keyless signing (goreleaser) + the docs job's Pages OIDC deploy
  id-token: write
  # GitHub build-provenance attestation (goreleaser/publish)
  attestations: write
  # artifact storage record for the attestation (goreleaser/publish)
  artifact-metadata: write
  # push container images to ghcr (goreleaser dockers_v2, when configured)
  packages: write
  # publish the docs site to GitHub Pages (docs job, when a zensical.toml exists)
  pages: write

jobs:
  release:
    uses: bitwise-media-group/github-workflows/.github/workflows/release.yaml@b3d4519a6d79376364184f0ca298685dcfa287f2 # v6.1.1
    with:
      # author the release PR as the FF Merge App so it can auto-merge (a
      # GITHUB_TOKEN-authored push fires no workflow_run to trigger the merge)
      app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
    secrets:
      # private key for the App that authors the release PR (same App as /merge)
      app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
