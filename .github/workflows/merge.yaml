# Fast-forward merge — thin caller for the org's reusable merge workflow. It
# enables both flows: a `/merge` comment merges an approved, green PR now;
# `/auto-merge` (or the `auto-merge` label) arms it to merge automatically once
# approved and green. Both preserve every commit signature via ff-merge.
#
# None of these triggers attach a check run to the PR's head commit, so the
# merge machinery leaves no skipped-job clutter on the checks list. The
# approval signal is captured by the companion merge-review-ack.yaml and
# re-enters via workflow_run; the scheduled sweep backstops any missed trigger.
#
# Prerequisites (one-time, org-wide — see bitwise-media-group/ff-merge):
#   - org variable FF_MERGE_CLIENT_ID and org secret FF_MERGE_PRIVATE_KEY
#   - the "FF Merge" App installed on this repo and in the ruleset bypass list
#
# Pinned to a full commit SHA (tag in the comment); Renovate keeps it fresh.

name: Merge

# issue_comment drives `/merge` and arms `/auto-merge`; workflow_run(completed)
# attempts the auto-merge once the PR is approved and green; the schedule
# sweeps armed PRs as a backstop. `workflows:` lists every workflow that must
# pass plus "Merge Review Ack" — whichever finishes last triggers the attempt,
# and ff-merge re-verifies all checks.
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      ["Continuous Integration", "Validate", "Security Analysis", "Merge Review Ack"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

# the App token does the privileged work; the caller grants nothing
permissions: {}

jobs:
  merge:
    uses: bitwise-media-group/github-workflows/.github/workflows/merge.yaml@1eaff010e2929a3583c50ffa325690216bc70462 # v6.2.0
    with:
      app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
